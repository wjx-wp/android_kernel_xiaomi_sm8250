name: Build KSU Boot for K40 (alioth)

on:
  workflow_dispatch: # 手动触发按钮

jobs:
  build_and_pack:
    name: Build & Pack Boot.img (MIUI + KSU)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 unzip

    - name: Setup Cache (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-alioth-build-miui-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-alioth-build-miui-
          kernel-ccache-alioth-
          kernel-ccache-

    - name: Setup Toolchain (ZyC-Clang 16)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Build Kernel (MIUI + KSU)
      run: |
        chmod +x build.sh build-miui.sh
        echo "Building alioth with KernelSU for MIUI..."
        bash build-miui.sh alioth ksu

    - name: Pack Finished boot.img via AIK
      run: |
        echo "====================================="
        echo "1. 准备工作环境与工具"
        echo "====================================="
        mkdir -p extracted_ak3
        git clone --depth=1 https://github.com/SebaUbuntu/AIK-Linux-mirror.git aik
        
        echo "====================================="
        echo "2. 处理原厂底包 (Base Boot)"
        echo "====================================="
        # 智能解压底包
        if [ -f "base/stock_boot.img.zip" ]; then
          echo "🎁 检测到 ZIP 格式底包，正在解压..."
          unzip -q base/stock_boot.img.zip -d base/
        elif [ -f "base/stock_boot.img.gz" ]; then
          echo "🎁 检测到 GZ 格式底包，正在解压..."
          gunzip -c base/stock_boot.img.gz > base/stock_boot.img
        fi
        
        # 递归智能寻找解压出来的 boot.img 或 stock_boot.img
        BASE_BOOT=$(find base -type f \( -name "boot.img" -o -name "stock_boot.img" \) | head -n 1)
        
        if [ -z "$BASE_BOOT" ]; then
          echo "⚠️ 致命错误：在 base 目录中未找到任何 boot.img！当前结构如下："
          ls -R base/
          exit 1
        fi
        
        echo "✅ 成功找到原厂底包：$BASE_BOOT"
        cp "$BASE_BOOT" aik/boot.img
        
        echo "====================================="
        echo "3. 解包原厂底包"
        echo "====================================="
        cd aik
        chmod +x unpackimg.sh repackimg.sh
        ./unpackimg.sh
        
        echo "====================================="
        echo "4. 提取新编译的内核"
        echo "====================================="
        unzip -q ../*.zip -d ../extracted_ak3
        
        # 智能寻找新内核 (排除 dtb, sh, md 等干扰文件)
        NEW_KERNEL=$(find ../extracted_ak3 -type f \( -name "Image*" -o -name "zImage*" -o -name "kernel" \) | grep -v -E "\.dtb|\.sh|\.md|\.txt" | head -n 1)
        
        if [ -z "$NEW_KERNEL" ]; then
          echo "⚠️ 致命错误：找不到有效的内核文件！ZIP 内部结构如下："
          ls -R ../extracted_ak3
          exit 1
        fi
        echo "🎉 成功提取新内核文件：$NEW_KERNEL"
        
        echo "====================================="
        echo "5. 执行内核替换 (缝合手术)"
        echo "====================================="
        # 智能寻找 AIK 拆包产生的老内核文件
        OLD_KERNEL=$(find split_img -type f \( -name "*-zImage" -o -name "*-kernel" -o -name "*-Image*" \) | grep -v -E "ramdisk|dtb" | head -n 1)
        
        if [ -z "$OLD_KERNEL" ]; then
          echo "⚠️ 致命错误：AIK 未能成功分离出原厂内核文件！"
          exit 1
        fi
        
        echo "🎯 找到原厂内核位置：$OLD_KERNEL"
        echo "💉 正在注入新内核..."
        cp -f "$NEW_KERNEL" "$OLD_KERNEL"
        
        export TERM=xterm
        echo "====================================="
        echo "6. 重新打包生成成品镜像"
        echo "====================================="
        ./repackimg.sh || true
        
        if [ ! -f "image-new.img" ]; then
          echo "⚠️ 致命错误：AIK 打包失败，未生成 image-new.img！"
          exit 1
        fi
        
        mv image-new.img ../ksu_boot_alioth_miui14.img
        echo "✅ 成品打包成功！"

    - name: Upload Finished Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Boot-Img-Alioth-KSU
        path: ksu_boot_alioth_miui14.img
        if-no-files-found: error
