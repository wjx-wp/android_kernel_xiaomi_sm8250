name: Build KSU Boot for K40 (alioth)

on:
  workflow_dispatch: # 手动触发按钮

jobs:
  build_and_pack:
    name: Build & Pack Boot.img (MIUI + KSU)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 unzip

    - name: Setup Cache (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-alioth-build-miui-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-alioth-build-miui-
          kernel-ccache-alioth-
          kernel-ccache-

    - name: Setup Toolchain (ZyC-Clang 16)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz

    - name: Build Kernel (MIUI + KSU)
      run: |
        chmod +x build.sh build-miui.sh
        echo "Building alioth with KernelSU for MIUI..."
        bash build-miui.sh alioth ksu

    - name: Pack Finished boot.img via Magiskboot
      run: |
        echo "====================================="
        echo "1. 准备工作环境"
        echo "====================================="
        mkdir -p workspace
        mkdir -p extracted_ak3
        
        echo "====================================="
        echo "2. 提取官方 Magiskboot 工具 (完美支持 V3 Header)"
        echo "====================================="
        # 黑科技：直接从官方 APK 里抽出 Linux 原生版神级打包工具
        wget -qO magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
        unzip -q -j magisk.apk "lib/x86_64/libmagiskboot.so" -d workspace/
        mv workspace/libmagiskboot.so workspace/magiskboot
        chmod +x workspace/magiskboot
        echo "✅ Magiskboot x86_64 工具就绪！"
        
        echo "====================================="
        echo "3. 处理原厂底包"
        echo "====================================="
        if [ -f "base/stock_boot.img.zip" ]; then
          unzip -q base/stock_boot.img.zip -d base/
        elif [ -f "base/stock_boot.img.gz" ]; then
          gunzip -c base/stock_boot.img.gz > base/stock_boot.img
        fi
        
        BASE_BOOT=$(find base -type f \( -name "boot.img" -o -name "stock_boot.img" \) | head -n 1)
        if [ -z "$BASE_BOOT" ]; then
          echo "⚠️ 未找到底包！请检查 base 文件夹。"
          exit 1
        fi
        cp "$BASE_BOOT" workspace/boot.img
        
        echo "====================================="
        echo "4. 提取新编译的 KernelSU 内核"
        echo "====================================="
        unzip -q ./*.zip -d extracted_ak3
        NEW_KERNEL=$(find extracted_ak3 -type f \( -name "Image*" -o -name "zImage*" -o -name "kernel" \) | grep -v -E "\.dtb|\.sh|\.md|\.txt" | head -n 1)
        if [ -z "$NEW_KERNEL" ]; then
          echo "⚠️ ZIP 包内找不到新内核文件！"
          exit 1
        fi
        echo "🎉 成功提取新内核文件：$NEW_KERNEL"
        
        echo "====================================="
        echo "5. 执行内核替换 (Magiskboot 官方级缝合)"
        echo "====================================="
        cd workspace
        ./magiskboot unpack boot.img
        
        if [ ! -f "kernel" ]; then
          echo "⚠️ Magiskboot 解包失败，未分离出 kernel 文件！"
          exit 1
        fi
        
        echo "💉 注入全新内核..."
        cp -f "../$NEW_KERNEL" kernel
        
        echo "====================================="
        echo "6. 重新打包生成成品镜像"
        echo "====================================="
        ./magiskboot repack boot.img ksu_boot_alioth_miui14.img
        
        if [ ! -f "ksu_boot_alioth_miui14.img" ]; then
          echo "⚠️ 致命错误：Magiskboot 打包失败！"
          exit 1
        fi
        
        mv ksu_boot_alioth_miui14.img ../
        echo "✅ 成品打包成功！"

    - name: Upload Finished Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: Finished-Boot-Img-Alioth-KSU
        path: ksu_boot_alioth_miui14.img
        if-no-files-found: error
